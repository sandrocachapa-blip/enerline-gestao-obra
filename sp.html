<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPonto · ENERLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f7;--panel:#ffffff;--panel2:#f7f9fb;--line:#e1e6ea;--line2:#cfd6dc;--text:#33373d;--muted:#69727d;--muted2:#7c8792;
  --green:#86BB46;--green2:#6FA331;--green3:#5f8f2a;--greendim:#eef6e3;--grey:#54595F;--dark:#33373d;--ok:#6FA331;--warn:#E0A526;--bad:#D64545;--prov:#6C63C9;--info:#2F80ED;
  --head:Urbanist,'Open Sans',Inter,system-ui,sans-serif;--sans:'Open Sans',Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:700;color:var(--dark);letter-spacing:-.2px}h2{font-size:19px}h3{font-size:15px}
a{color:var(--green2)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{padding:22px 16px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 8px 12px;border-bottom:3px solid var(--green)}
.brand img{width:150px;height:auto;display:block}
.brand strong{font-family:var(--head);font-size:18px;letter-spacing:-.4px;color:var(--dark)}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px;letter-spacing:1.8px;text-transform:uppercase}
.navlabel{font-size:10px;letter-spacing:2px;color:var(--muted2);padding:0 14px;margin:12px 0 6px;font-weight:700}
.nav{display:grid;gap:3px}
.nav button{border:0;background:transparent;color:var(--grey);text-align:left;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;width:100%;font-weight:600}
.nav button.active{color:var(--green3);background:var(--greendim);box-shadow:inset 3px 0 0 var(--green)}
.nav button:hover{background:#f1f4f6;color:var(--dark)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav .n{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.sidefooter{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.sidefooter small{color:var(--muted);font-size:11px}.sidefooter strong{display:block;margin:6px 0;color:var(--dark);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 0 3px #86bb4633}.dot.off{background:var(--warn);box-shadow:0 0 0 3px #e0a52633}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px #d6454533}
.content{padding:30px clamp(18px,3.4vw,55px);max-width:1500px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.eyebrow{color:var(--green2);font-size:11px;letter-spacing:2.4px;font-weight:800}
.top h1{font-size:clamp(26px,2.8vw,40px);letter-spacing:-1px;margin:8px 0 6px;text-transform:uppercase;font-weight:800}
.muted{color:var(--muted)}.small{font-size:12px}
.user{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line2);border-radius:99px;padding:7px 14px 7px 7px;font-size:13px;cursor:pointer;flex:none;box-shadow:0 2px 8px #0000000a}
.user:hover{border-color:var(--green)}
.avatar{height:34px;width:34px;border-radius:50%;background:var(--greendim);display:grid;place-items:center;color:var(--green3);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat,.kpi{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;gap:14px;align-items:center;box-shadow:0 4px 18px #0000000a;border-top:3px solid var(--green)}
.stat span,.kpi .l{font-size:12px;color:var(--muted)}
.stat strong,.kpi .v{display:block;margin-top:6px;font-size:26px;font-weight:800;font-family:var(--head);color:var(--dark)}
.stat .ico{font-size:24px;color:var(--green)}
.kpi{flex-direction:column;align-items:flex-start;gap:0}.kpi .v{margin-top:0}.kpi .l{margin-top:4px}
.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.prov .v{color:var(--prov)}
.workspace{display:grid;grid-template-columns:minmax(290px,1.13fr) minmax(295px,.87fr);gap:21px}
.panel,.card{border:1px solid var(--line);background:#fff;border-radius:18px;box-shadow:0 8px 30px #0000000d}
.panel{overflow:hidden}
.card{padding:20px 22px}.card h3{margin-bottom:10px}
.panelhead{padding:22px 24px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:14px}
.panelhead h2{margin:0 0 5px;font-size:18px}.panelhead p{margin:0;color:var(--muted);font-size:12px}
.pill{color:var(--green3);border:1px solid #bfdc9a;background:var(--greendim);font-size:11px;padding:6px 10px;border-radius:100px;white-space:nowrap;font-weight:700}
.pill.warn{color:#8a5d00;border-color:#f0d28a;background:#fff6dd}.pill.bad{color:#9b2c2c;border-color:#f3b4b4;background:#fdeaea}
/* câmara */
.camera{margin:3px 24px 20px;min-height:360px;height:min(40vw,410px);border:1px solid #3a3f46;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 43%,#4a5058,#2b2f35 67%)}
.camera video,.camera canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camera video{display:none}.camera.active video{display:block}
.camera canvas{pointer-events:none;z-index:3}
.camtop{position:absolute;top:14px;left:14px;z-index:4;font-size:11px;color:#fff;background:#86bb46;border-radius:7px;padding:7px 10px;font-weight:800;letter-spacing:.5px}
.faceguide{width:min(58%,230px);height:76%;max-height:300px;border:2px dashed #a6d66a;border-radius:48% 48% 42% 42%;position:absolute;z-index:2;box-shadow:0 0 45px #86bb4633}
.faceguide:before,.faceguide:after{content:"";position:absolute;width:31px;height:31px;border-color:#b9e67e;border-style:solid}
.faceguide:before{left:-4px;top:15px;border-width:3px 0 0 3px;border-radius:11px 0 0 0}.faceguide:after{right:-4px;bottom:15px;border-width:0 3px 3px 0;border-radius:0 0 11px 0}
.silhouette{position:absolute;bottom:0;width:220px;height:265px;opacity:.5}.silhouette svg{width:100%;height:100%;fill:#5c636c}
.scanline{z-index:2;position:absolute;top:46%;height:2px;width:58%;background:#a6e060;box-shadow:0 0 17px 5px #86bb4666;animation:scanning 4s ease-in-out infinite alternate}
@keyframes scanning{from{top:29%}to{top:74%}}
.camera.active .silhouette{display:none}.camera.locked .faceguide,.camera.locked .scanline{display:none}
.camerafoot{position:absolute;bottom:14px;left:0;right:0;z-index:4;color:#fff;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;padding:0 14px}
.scanmsg{position:absolute;top:14px;right:14px;z-index:4;font-size:12px;color:#fff;background:#00000099;border-radius:7px;padding:7px 10px;max-width:60%}
.camoverlay{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#2b2f35e6;padding:20px;text-align:center}
.camoverlay[hidden]{display:none}.camoverlay .small{color:#dfe5ea;max-width:420px;line-height:1.5}.camoverlay button{font-size:16px;padding:16px 26px}
.camactions{display:flex;gap:12px;padding:0 24px 24px;flex-wrap:wrap}
.cam{position:relative;width:100%;aspect-ratio:4/3;border:1px solid #3a3f46;border-radius:14px;overflow:hidden;background:#2b2f35}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.cam canvas{pointer-events:none}
.cam .lbl{position:absolute;left:12px;bottom:12px;background:#00000099;color:#fff;padding:5px 10px;border-radius:7px;font-size:12px;z-index:2}.cam .frame{display:none}
/* botões e campos */
button{border:1px solid var(--line2);background:#fff;color:var(--dark);border-radius:10px;padding:10px 15px;transition:.15s;font-weight:600}
button:hover{border-color:var(--green);color:var(--green3)}
button.primary{background:var(--green);color:#fff;font-weight:800;border:0;box-shadow:0 6px 16px #86bb4655}
button.primary:hover{background:var(--green2);color:#fff}
button.secondary{background:#fff;color:var(--dark);border:1px solid var(--line2)}
button.danger{border-color:#f3b4b4;color:#b13232}button.danger:hover{background:#fdeaea}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:7px 11px;font-size:12px;border-radius:8px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:9px;background:#fff;border:1px solid var(--line2);color:var(--dark);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #86bb4633}
label{display:block;font-size:12px;font-weight:700;color:var(--grey);margin:0 0 7px}
.field{margin:0 0 15px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:3px 0 20px}
.method{padding:12px 8px;border:1px solid var(--line2);background:#fff;color:var(--grey);border-radius:10px;font-weight:700}
.method.selected{color:var(--green3);border-color:var(--green);background:var(--greendim)}
.rowfields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.location{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid #cfe4b3;background:var(--greendim);margin:7px 0 16px}
.location .symbol{font-size:22px;color:var(--green2)}.location strong{font-size:12px;color:var(--dark)}.location small{display:block;color:#5e7a3c;font-size:11px;margin-top:4px;overflow-wrap:anywhere}
.location button{margin-left:auto;background:transparent;border:0;color:var(--green3);font-size:12px;font-weight:800;padding:4px}
.check{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:18px}.check input{accent-color:var(--green);margin-top:3px;width:auto}
.submit{width:100%}
.message{min-height:27px;padding-top:10px;color:var(--green3);font-size:12px;font-weight:600}.message.err{color:var(--bad)}
.note{font-size:11px;color:var(--muted2);line-height:1.6;margin-top:7px}
.formbody{padding:0 24px 24px}
.passes{display:flex;gap:8px}.pass{padding:4px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-size:12px}.pass.on{border-color:var(--green);color:var(--green3)}.pass.done{background:var(--greendim);color:var(--green3);border-color:transparent}.pass.done::before{content:'✓ '}
/* painel de gestão */
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.mt{margin-top:14px}.mb{margin-bottom:14px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pageactions{display:flex;justify-content:flex-end;gap:10px;margin:-8px 0 16px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0;background:#f7f9fb;z-index:1}
tr.click{cursor:pointer}tr.click:hover td{background:var(--greendim)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap;border:1px solid transparent}
.b-CONFIRMADO,.b-APROVADA,.b-PASS{background:var(--greendim);color:var(--green3);border-color:#bfdc9a}
.b-PENDENTE_REVISAO,.b-PENDENTE,.b-UNKNOWN,.b-ERROR{background:#fff6dd;color:#8a5d00;border-color:#f0d28a}
.b-REJEITADO,.b-REJEITADA,.b-FAIL{background:#fdeaea;color:#9b2c2c;border-color:#f3b4b4}
.b-PROVISORIO_OFFLINE{background:#ece9ff;color:#4b43a8;border-color:#c9c3f3}
.b-gold{background:var(--greendim);color:var(--green3);border-color:#bfdc9a}.b-grey{background:#f1f4f6;color:var(--muted);border-color:var(--line)}
.notice{border-left:3px solid var(--green);padding:10px 12px;background:var(--greendim);border-radius:0 12px 12px 0;font-size:13px}
.sim{border:1px solid #f0d28a;background:#fff6dd;border-radius:12px;padding:10px 12px}.sim h4{color:#8a5d00;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.policy-lock{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;color:var(--grey);font-weight:600}
.switch i{width:40px;height:22px;border-radius:999px;background:#cfd6dc;position:relative;transition:.2s}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.switch input{display:none}.switch input:checked+i{background:var(--green)}.switch input:checked+i::after{left:20px}
.userbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.userbtn .av{width:36px;height:36px;border-radius:50%;background:var(--greendim);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green3);flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--greendim);color:var(--green3);font-weight:800}
img.av{object-fit:cover;display:inline-block}.av.photo{border:2px solid var(--green)}
.av.sm{width:30px;height:30px;font-size:12px;flex:none}.av.big{width:72px;height:72px;font-size:24px;flex:none}.av.xl{width:120px;height:120px;font-size:40px;flex:none}
.wcard .av{width:48px;height:48px;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 16px;border-radius:999px;font-weight:700}
.chips button.on{background:var(--green);color:#fff;border-color:transparent;font-weight:800;box-shadow:0 6px 16px #86bb4655}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;max-height:46vh;overflow:auto;padding:2px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border-radius:14px;text-align:center;background:#fff;border:1px solid var(--line)}
.wcard:hover{background:var(--greendim);border-color:var(--green)}
.wcard .nm{font-weight:700;font-size:13px;color:var(--dark);margin-top:4px}.wcard .sub{font-size:11px;color:var(--muted)}.wcard .tag{font-size:11px;color:var(--green3);margin-top:3px}.wcard.noface .tag{color:var(--muted)}
.clock{font-family:var(--head);font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--dark)}.clock small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:4px}
.idcard{padding:4px 0 0}
.idwrap{display:flex;gap:18px;align-items:center}
.idphoto{position:relative;flex:none}
.idphoto .av{width:120px;height:120px;font-size:40px;border-radius:22px;box-shadow:0 0 0 3px var(--green),0 14px 30px #0002}
.idphoto.bad .av{box-shadow:0 0 0 3px var(--bad),0 14px 30px #0002}
.idcheck{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #0003}
.idphoto.bad .idcheck{background:var(--bad)}
.idname{font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:2px 0;color:var(--dark)}
.idmeta{display:grid;grid-template-columns:1fr;gap:8px}
.idmeta>div{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.idmeta b{font-size:16px;color:var(--dark)}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps span{width:30px;height:4px;border-radius:2px;background:var(--line2)}.steps span.on{background:var(--green)}
.pin{font-size:26px;letter-spacing:8px;text-align:center}
.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.actions button{padding:18px 16px;font-size:15px;font-weight:700}
.fp{width:110px;height:140px;border-radius:55px 55px 65px 65px;border:2px solid var(--green);margin:10px auto;display:flex;align-items:center;justify-content:center;background:repeating-radial-gradient(circle at 50% 60%,transparent 0 6px,#86bb4633 6px 8px)}
.receipt{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel2)}.receipt .big{font-family:var(--head);font-size:22px;font-weight:800}
.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.perm>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);display:block}.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:var(--panel2)}
.capture{width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line2);display:block;margin-top:6px}.capture.face{max-width:220px}

.fpx{position:relative;width:150px;height:190px;margin:12px auto;border-radius:75px 75px 85px 85px;border:2px solid var(--green);background:#0f1a0f;overflow:hidden;box-shadow:0 0 0 4px #86bb4620}
.fpx svg{position:absolute;inset:0;width:100%;height:100%}
.fpx svg path{fill:none;stroke:#86bb46;stroke-width:2.2;stroke-linecap:round;opacity:.85}
.fpx .ln{position:absolute;left:0;right:0;height:3px;top:0;background:linear-gradient(90deg,transparent,#c9ff8c,transparent);box-shadow:0 0 14px 4px #86bb46aa;opacity:0}
.fpx.scan .ln{opacity:1;animation:fpscan 1.1s ease-in-out infinite alternate}
.fpx.scan svg path{stroke:#d7ffa8;animation:fppulse .9s ease-in-out infinite alternate}
.fpx.ok{border-color:#2e9e57}.fpx.ok svg path{stroke:#4be08a}
.fpx .pc{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:700 12px var(--head,sans-serif);color:#c9ff8c}
@keyframes fpscan{from{top:2%}to{top:96%}}@keyframes fppulse{from{opacity:.45}to{opacity:1}}
.demo-wm{position:fixed;left:0;right:0;top:50%;z-index:2147483000;pointer-events:none;text-align:center;font:900 clamp(28px,5.5vw,78px)/1 Arial,sans-serif;letter-spacing:.1em;color:rgba(128,128,128,.16);transform:translateY(-50%) rotate(-18deg);user-select:none;text-transform:uppercase;white-space:nowrap}
/* modais */
#modal,#modal2{position:fixed;inset:0;background:#1b1f24aa;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal2{z-index:55}#modal.open,#modal2.open{display:flex}
.modalbox{background:#fff;border:1px solid var(--line);border-radius:18px;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 22px 70px #0004}
.modalbox.wide{max-width:1000px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);border:1px solid var(--green);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw;box-shadow:0 10px 30px #0004}

<script>
/* ===================== SmartPonto — Motor de regras (sem DOM) ===================== */
const SP = (() => {
  const TZ = 'Africa/Luanda';
  const ACTIONS = { ENTRADA: 'Entrada', SAIDA: 'Saída', INICIO_PAUSA: 'Início de pausa', FIM_PAUSA: 'Fim de pausa' };
  const STATES = ['PROVISORIO_OFFLINE', 'PENDENTE_REVISAO', 'CONFIRMADO', 'REJEITADO'];
  const METHOD_LABEL = { face: 'Facial', finger: 'Digital' };

  const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const nowIso = () => new Date().toISOString();

  function fmtParts(iso) {
    const d = new Date(iso);
    const f = new Intl.DateTimeFormat('pt-PT', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const o = {}; f.formatToParts(d).forEach(p => o[p.type] = p.value);
    return o;
  }
  const fmtDT = iso => { if (!iso) return '—'; const o = fmtParts(iso); return `${o.day}/${o.month}/${o.year} ${o.hour}:${o.minute}`; };
  const fmtDTS = iso => { if (!iso) return '—'; const o = fmtParts(iso); return `${o.day}/${o.month}/${o.year} ${o.hour}:${o.minute}:${o.second}`; };
  const fmtT = iso => { if (!iso) return '—'; const o = fmtParts(iso); return `${o.hour}:${o.minute}`; };
  const fmtD = iso => { if (!iso) return '—'; const o = fmtParts(iso); return `${o.day}/${o.month}/${o.year}`; };
  const localDate = iso => { const o = fmtParts(iso); return `${o.year}-${o.month}-${o.day}`; }; // YYYY-MM-DD em Luanda

  // Luanda = UTC+1 sem DST: construir ISO a partir de data local e hora local
  const luandaToIso = (ymd, hm) => new Date(`${ymd}T${hm}:00+01:00`).toISOString();

  function haversine(lat1, lon1, lat2, lon2) {

  /* ---------- Estado ---------- */
  function newState() {
    return {
      policy: {
        version: 'v1.0', authentication: 'either', gpsRequired: true, antiSpoof: true, offlineProvisional: true, manualReview: true,
        radius: 100, perimeterCheck: false, maxAgeSec: 15, maxAccuracy: 30, challengeTtlSec: 60, maxAttempts: 3, attemptWindowMin: 2,
        testMode: true, trustBrowserGps: true, engineVersion: 'face-api 1.7.15 no browser · SIM-1.0 como recurso', updatedAt: nowIso(), history: []
      },
      users: [], workers: [], locations: [], devices: [], shifts: [], holidays: [],
      events: [], corrections: [], audit: [], blocks: {}, attempts: {}
    };
  }

  function audit(state, entry) {
    state.audit.unshift(Object.assign({ id: uid('aud'), at: nowIso() }, entry));
  }

  const workerActiveAt = (w, iso) => !!w && (w.active || (w.deactivatedAt && iso < w.deactivatedAt));
  function workerAuthorizedAt(w, loc, iso) {
    if (!w || !loc) return false;
    if (loc.validFrom && iso < loc.validFrom) return false;
    if (loc.validTo && iso > loc.validTo) return false;
    return !w.locations || w.locations.length === 0 || w.locations.includes(loc.id);
  }

  /* ---------- Sequência de assiduidade ---------- */
  function presenceStatus(prevEvents) {
    // prevEvents ordenados por capturedAt, apenas CONFIRMADO/PROVISORIO e correções aprovadas
    let st = 'out';
    for (const e of prevEvents) {
      if (e.action === 'ENTRADA') st = 'in';
      else if (e.action === 'SAIDA') st = 'out';
      else if (e.action === 'INICIO_PAUSA') st = 'pause';
      else if (e.action === 'FIM_PAUSA') st = 'in';
    }
    return st;
  }
  function checkSequence(action, prevEvents) {
    const st = presenceStatus(prevEvents);
    const last = prevEvents[prevEvents.length - 1];
    if (action === 'ENTRADA' && st !== 'out') return st === 'in' ? 'Sequência irregular: duas entradas seguidas (saída em falta)' : 'Sequência irregular: entrada durante pausa';
    if (action === 'SAIDA' && st === 'out') return 'Sequência irregular: saída sem entrada';
    if (action === 'SAIDA' && st === 'pause') return 'Sequência irregular: saída durante pausa (fim de pausa em falta)';
    if (action === 'INICIO_PAUSA' && st !== 'in') return 'Sequência irregular: início de pausa sem entrada ativa';
    if (action === 'FIM_PAUSA' && st !== 'pause') return 'Sequência irregular: fim de pausa sem início de pausa';
    if (last && action === 'ENTRADA' && st === 'out') return null;
    return null;
  }

  /* ---------- Decisão (RN01–RN07, RN13) ---------- */
  function evaluate(ctx) {

    if (!dev) return rej('Dispositivo não registado');

    if (ctx.signatureValid === false) return rej('Assinatura do evento inválida', true);
    if (!loc) return rej('Local não definido para o dispositivo');

    if (loc.allowedDevices && loc.allowedDevices.length && !loc.allowedDevices.includes(dev.id)) return rej('Dispositivo não permitido neste local');

    // RN01/RN02 — método

    if (!w.biometrics || !w.biometrics[m] || !w.biometrics[m].enrolled) return rej(`Método ${METHOD_LABEL[m] || m} não cadastrado para este trabalhador`);
    if (loc.allowedMethods && !loc.allowedMethods.includes(m)) return rej(`Método ${METHOD_LABEL[m]} não habilitado neste local`);
    if (m === 'finger' && dev.readerAntiSpoof === false) return rej('Leitor digital sem anti-spoof verificável está desabilitado');

    // RN03 — anti-spoof
    if (ctx.antispoof === 'FAIL') return rej('Anti-spoof FAIL: apresentação fraudulenta detetada', true, true);
    // RN07 — correspondência falhada permite nova tentativa com outro método
    if (ctx.identityMatch === false) return rej('Correspondência biométrica falhou para a identidade selecionada');

    if (g.mocked) return rej('Localização simulada detetada no dispositivo', true, true);

    // Pendências (RN03 UNKNOWN/ERROR, RN04/RN05, RN10, RN13)
    const pend = r.pendings;
    if (ctx.antispoof !== 'PASS') pend.push(`Anti-spoof ${ctx.antispoof || 'ERROR'}: resultado inconclusivo (nunca tratado como PASS)`);
    if (ctx.identityMatch !== true) pend.push('Identidade não aprovada pelo motor biométrico');

    const R = loc.radius || P.radius;
    if (!g.available) pend.push('Localização GPS indisponível na captura (GPS desligado, permissão negada ou sem GNSS)');
    else {

      if (!okSource) pend.push(`Posição sem origem GPS/GNSS (origem: ${g.source || 'desconhecida'})`);
      if (g.ageSec > P.maxAgeSec) pend.push(`Idade da posição ${g.ageSec} s > ${P.maxAgeSec} s`);
      if (g.accuracy > P.maxAccuracy) pend.push(`Precisão ${g.accuracy} m > ${P.maxAccuracy} m`);
      if (P.perimeterCheck !== false && g.distance != null) {
        const d = g.distance, a = g.accuracy;
        if (d - a > R) return rej(`Fora do perímetro: distância ${Math.round(d)} m (precisão ${a} m) > raio ${R} m`);
        if (!(d + a <= R)) pend.push(`Fronteira inconclusiva: ${Math.round(d)} m + ${a} m > raio ${R} m`);
      }
    }
    if (ctx.clockTrusted === false) pend.push('Instante de captura não demonstrável (desvio de relógio ou reinício)');

    const seq = checkSequence(ctx.action, ctx.prevEvents || []);
    if (seq) pend.push(seq);

    if (pend.length) { r.state = 'PENDENTE_REVISAO'; r.reason = pend.join('; '); return r; }
    if (ctx.online === false) { r.state = 'PROVISORIO_OFFLINE'; r.reason = 'Captura offline validada localmente; pendente de sincronização e validação pelo servidor'; return r; }
    r.state = 'CONFIRMADO'; r.reason = P.perimeterCheck !== false ? 'Identidade, anti-spoof, GPS, perímetro, autorização e sequência aprovados' : 'Identidade, anti-spoof, coordenada GPS, autorização e sequência aprovados';
    return r;
  }

  /* ---------- Eventos ---------- */
  function workerTimeline(state, workerId, beforeIso) {
    const evs = state.events.filter(e => e.workerId === workerId && (e.state === 'CONFIRMADO' || e.state === 'PROVISORIO_OFFLINE') && (!beforeIso || e.capturedAt < beforeIso))

    const cors = state.corrections.filter(c => c.workerId === workerId && c.status === 'APROVADA' && (!beforeIso || c.at < beforeIso))
      .map(c => ({ action: c.action, capturedAt: c.at, origin: 'correção administrativa', id: c.id, state: 'CORRECAO' }));
    return evs.concat(cors).sort((a, b) => a.capturedAt < b.capturedAt ? -1 : 1);
  }

  function buildCtx(state, payload) {

    const loc = state.locations.find(x => x.id === (payload.locationId || (dev && dev.locationId)));

      signatureValid: ev.signatureValid !== false, clockTrusted: ev.clockTrusted !== false, capturedAt: payload.capturedAt,

  }

  // RN10 — idempotência: o mesmo event_id devolve sempre o mesmo evento

      event_id: payload.event_id || uid('evt'), workerId: payload.workerId, action: payload.action, deviceId: payload.deviceId,

      state: res.state, reason: res.reason, alert: res.alert, policyVersion: state.policy.version, engineVersion: state.policy.engineVersion,

  // RN09 — reconciliação da fila offline

      });

  /* ---------- Revisão manual (RN11, RN12) ---------- */
  function canReview(state, reviewer, worker) {
    if (!reviewer) return 'Sem sessão';
    if (!['admin', 'rh', 'supervisor'].includes(reviewer.role)) return 'Perfil sem permissão de revisão';
    if (reviewer.workerId && worker && reviewer.workerId === worker.id) return 'Autoaprovação não permitida';
    if (reviewer.role === 'supervisor' && worker && reviewer.dept !== worker.dept) return 'Supervisor limitado à equipa autorizada';
    return null;
  }
  function mandatoryEvidenceOk(state, ev) {
    const P = state.policy, g = ev.gps || {}, loc = state.locations.find(l => l.id === ev.locationId);
    const R = (loc && loc.radius) || P.radius;
    if (ev.antispoof !== 'PASS') return 'anti-spoof não é PASS';
    if (ev.identityMatch !== true) return 'identidade não aprovada';
    if (ev.signatureValid === false) return 'assinatura inválida';
    if (!g.available) return 'sem GPS válido na captura';
    if (g.mocked) return 'localização simulada';
    const okSource = g.source === 'gps' || (g.source === 'browser' && P.trustBrowserGps);
    if (!okSource) return 'posição sem origem GPS/GNSS';
    if (g.ageSec > P.maxAgeSec) return 'idade da posição excede o limite';
    if (g.accuracy > P.maxAccuracy) return 'precisão insuficiente';
    if (P.perimeterCheck !== false && g.distance != null && g.distance - g.accuracy > R) return 'fora do perímetro';

  function reviewEvent(state, { eventId, reviewer, decision, reason }) {
    const ev = state.events.find(e => e.event_id === eventId);
    if (!ev) return { ok: false, error: 'Evento não encontrado' };
    const w = state.workers.find(x => x.id === ev.workerId);
    const log = (dec, why) => audit(state, { user: reviewer ? reviewer.name : '?', role: reviewer ? reviewer.role : '?', action: 'REVISAO', ref: eventId, decision: dec, reason: why });
    if (!reason || !reason.trim()) { log('BLOQUEADO', 'Motivo obrigatório em falta'); return { ok: false, error: 'Motivo obrigatório' }; }
    const perm = canReview(state, reviewer, w);
    if (perm) { log('BLOQUEADO', perm); return { ok: false, error: perm }; }
    if (decision === 'CONFIRMAR') {
      const miss = mandatoryEvidenceOk(state, ev);
      if (miss) { log('BLOQUEADO', `Tentativa de aprovar sem requisito obrigatório: ${miss}`); return { ok: false, error: `API bloqueou: ${miss}. A revisão não pode inventar GPS, alterar anti-spoof ou substituir identidade.` }; }
    }
    if (ev.state === 'CONFIRMADO' || ev.state === 'REJEITADO') { log('BLOQUEADO', 'Evento já em estado final'); return { ok: false, error: 'Evento já em estado final; uma nova tentativa é um novo evento' }; }
    if (decision === 'CONFIRMAR') {
      ev.history.push({ at: nowIso(), by: reviewer.name, from: ev.state, to: 'CONFIRMADO', reason });
      ev.state = 'CONFIRMADO'; ev.reviewedBy = reviewer.name; ev.reviewReason = reason;
      log('CONFIRMADO', reason); return { ok: true, event: ev };
    }
    if (decision === 'REJEITAR' || decision === 'NOVA_CAPTURA') {
      const why = decision === 'NOVA_CAPTURA' ? 'Nova captura solicitada: ' + reason : reason;
      ev.history.push({ at: nowIso(), by: reviewer.name, from: ev.state, to: 'REJEITADO', reason: why });
      ev.state = 'REJEITADO'; ev.reviewedBy = reviewer.name; ev.reviewReason = why;
      log('REJEITADO', why); return { ok: true, event: ev };
    }

  }
  function unblockDevice(state, { deviceId, user, reason }) {
    if (!user || !['admin', 'rh'].includes(user.role)) return { ok: false, error: 'Só Administrador ou RH podem desbloquear' };
    if (!reason) return { ok: false, error: 'Motivo obrigatório' };
    delete state.blocks[deviceId];
    audit(state, { user: user.name, role: user.role, action: 'DESBLOQUEIO_SESSAO', ref: deviceId, decision: 'OK', reason });
    return { ok: true };
  }

  /* ---------- Correções administrativas (RN08, RN11, CA22) ---------- */
  function requestCorrection(state, { workerId, action, at, reason, requestedBy, linkedEventId }) {
    if (!requestedBy || !['admin', 'rh', 'supervisor'].includes(requestedBy.role)) return { ok: false, error: 'Sem permissão para pedir correção' };
    if (!reason) return { ok: false, error: 'Motivo obrigatório' };
    const c = { id: uid('cor'), workerId, action, at, reason, requestedBy: requestedBy.id, requestedByName: requestedBy.name, linkedEventId: linkedEventId || null, status: 'PENDENTE', createdAt: nowIso() };
    state.corrections.unshift(c);
    audit(state, { user: requestedBy.name, role: requestedBy.role, action: 'PEDIDO_CORRECAO', ref: c.id, decision: 'PENDENTE', reason });
    return { ok: true, correction: c };
  }
  function decideCorrection(state, { correctionId, approver, decision, reason }) {
    const c = state.corrections.find(x => x.id === correctionId);
    if (!c) return { ok: false, error: 'Correção não encontrada' };
    const log = (dec, why) => audit(state, { user: approver ? approver.name : '?', role: approver ? approver.role : '?', action: 'DECISAO_CORRECAO', ref: correctionId, decision: dec, reason: why });
    const w = state.workers.find(x => x.id === c.workerId);
    if (!reason) { log('BLOQUEADO', 'Motivo em falta'); return { ok: false, error: 'Motivo obrigatório' }; }
    if (!approver || !['admin', 'rh', 'supervisor'].includes(approver.role)) { log('BLOQUEADO', 'Sem permissão'); return { ok: false, error: 'Sem permissão' }; }
    if (approver.id === c.requestedBy) { log('BLOQUEADO', 'Autoaprovação do próprio pedido'); return { ok: false, error: 'O autor do pedido não pode aprová-lo' }; }
    if (approver.workerId && approver.workerId === c.workerId) { log('BLOQUEADO', 'Autoaprovação'); return { ok: false, error: 'Autoaprovação não permitida' }; }
    if (approver.role === 'supervisor' && w && w.dept !== approver.dept) { log('BLOQUEADO', 'Fora da equipa'); return { ok: false, error: 'Supervisor limitado à equipa autorizada' }; }
    if (c.status !== 'PENDENTE') { log('BLOQUEADO', 'Já decidida'); return { ok: false, error: 'Correção já decidida' }; }
    c.status = decision === 'APROVAR' ? 'APROVADA' : 'REJEITADA'; c.decidedBy = approver.name; c.decidedAt = nowIso(); c.decisionReason = reason;
    log(c.status, reason); return { ok: true, correction: c };
  }

  /* ---------- Cálculo de horas (RN13, Passo 11) ---------- */
  function shiftFor(state, w) { return state.shifts.find(s => s.id === w.shiftId) || state.shifts[0]; }
  function computeShifts(state, { workerIds, from, to, locationId }) {
    // from/to: YYYY-MM-DD (data de início do turno, em Luanda). Só CONFIRMADO + correções aprovadas.
    const rows = [];
    const ids = workerIds || state.workers.map(w => w.id);
    for (const wid of ids) {
      const w = state.workers.find(x => x.id === wid); if (!w) continue;
      const sh = shiftFor(state, w);
      const tl = state.events.filter(e => e.workerId === wid && e.state === 'CONFIRMADO' && (!locationId || e.locationId === locationId))
        .map(e => ({ action: e.action, at: e.capturedAt, origin: 'Biometria', id: e.event_id, locationId: e.locationId }))
        .concat(state.corrections.filter(c => c.workerId === wid && c.status === 'APROVADA').map(c => ({ action: c.action, at: c.at, origin: 'Correção administrativa', id: c.id })))
        .sort((a, b) => a.at < b.at ? -1 : 1);
      let cur = null;
      const close = () => { if (cur) { rows.push(cur); cur = null; } };
      for (const e of tl) {
        if (e.action === 'ENTRADA') {
          close();
          const date = localDate(e.at);
          cur = { workerId: wid, code: w.code, name: w.name, dept: w.dept, costCenter: w.costCenter, shift: sh ? sh.name : '—', date, entrada: e.at, saida: null, pauseMin: 0, pauseOpen: null, workedMin: 0, lateMin: 0, incomplete: true, origins: new Set([e.origin]), locationId: e.locationId };
          if (sh) { const [h, m] = sh.start.split(':').map(Number); const late = localMinutes(e.at) - (h * 60 + m); cur.lateMin = late > (sh.toleranceMin || 0) ? late : 0; }
        } else if (!cur) { continue; }
        else if (e.action === 'INICIO_PAUSA') { cur.pauseOpen = e.at; cur.origins.add(e.origin); }
        else if (e.action === 'FIM_PAUSA') { if (cur.pauseOpen) { cur.pauseMin += (new Date(e.at) - new Date(cur.pauseOpen)) / 60000; cur.pauseOpen = null; } cur.origins.add(e.origin); }
        else if (e.action === 'SAIDA') {
          cur.saida = e.at; cur.origins.add(e.origin); cur.incomplete = false;
          cur.workedMin = Math.max(0, (new Date(e.at) - new Date(cur.entrada)) / 60000 - cur.pauseMin);
          close();
        }
      }
      close();
    }
    return rows.filter(r => (!from || r.date >= from) && (!to || r.date <= to)).map(r => Object.assign(r, { origins: [...r.origins].join(' + ') }));
  }

  /* ---------- Fila offline cifrada (RN09, CA19) ---------- */
  const b64 = { enc: u8 => btoa(String.fromCharCode(...u8)), dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
  async function getDeviceKey(storage) {
    const subtle = (globalThis.crypto || {}).subtle; if (!subtle) throw new Error('Web Crypto indisponível');
    let jwk = storage.getItem('sp_device_key');
    if (jwk) return subtle.importKey('jwk', JSON.parse(jwk), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
    const key = await subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    storage.setItem('sp_device_key', JSON.stringify(await subtle.exportKey('jwk', key)));

    if (!navigator.onLine) { setSyncStatus('warn', 'Sem internet — guardado localmente'); return; }
    SYNC.busy = true; SYNC.pending = false; setSyncStatus('busy', 'A sincronizar…');
    try {
      const H = { 'content-type': 'application/json', 'x-smartponto-key': SYNC.key };
      if (first || !SYNC.since) {
        // primeira ligação deste dispositivo: adota o estado do servidor; se o servidor estiver vazio, envia o estado local
        const r = await fetch(syncUrl() + '?since=1970-01-01T00:00:00Z', { headers: H });
        if (r.status === 401) throw Object.assign(new Error('Chave de acesso inválida'), { auth: true });
        const d = await r.json(); if (d.error) throw new Error(d.error);
        if (d.state) { for (const c of COLS) S[c] = d.state[c] || []; S.policy = d.state.policy || S.policy; S.holidays = d.state.holidays || []; S.blocks = d.state.blocks || {}; S.audit = d.state.audit || []; S.events = (d.events || []).sort((a, b) => a.capturedAt < b.capturedAt ? 1 : -1); Object.keys(templateCache).forEach(k => delete templateCache[k]); SYNC.since = d.serverTime; }
        else { const r2 = await fetch(syncUrl(), { method: 'POST', headers: H, body: JSON.stringify({ since: '1970-01-01T00:00:00Z', state: S, events: S.events }) }); const d2 = await r2.json(); if (d2.error) throw new Error(d2.error); SYNC.since = d2.serverTime; }
        buildSnap(); LS.setItem('sp_sync_since', SYNC.since); LS.setItem('sp_enerline_state', JSON.stringify(S));
        setSyncStatus('ok', 'Sincronizado ' + SP.fmtT(SP.nowIso())); SYNC.busy = false; if (user && user.role !== 'terminal') render(); else if (T && T.step === 'scan') updSideFoot(); return;
      }
      const ch = localChanges();
      const r = ch.state || ch.events.length
        ? await fetch(syncUrl(), { method: 'POST', headers: H, body: JSON.stringify({ since: SYNC.since, state: ch.state, events: ch.events }) })
        : await fetch(syncUrl() + '?since=' + encodeURIComponent(SYNC.since), { headers: H });
      if (r.status === 401) throw Object.assign(new Error('Chave de acesso inválida'), { auth: true });
      const d = await r.json(); if (d.error) throw new Error(d.error);
      const changed = applyServer(d); SYNC.since = d.serverTime; buildSnap(); LS.setItem('sp_sync_since', SYNC.since); LS.setItem('sp_enerline_state', JSON.stringify(S));
      setSyncStatus('ok', 'Sincronizado ' + SP.fmtT(SP.nowIso()));
      if (changed && user && user.role !== 'terminal' && !$('#modal').classList.contains('open')) render();
    } catch (e) { setSyncStatus(e.auth ? 'bad' : 'warn', e.auth ? 'Chave de acesso inválida' : 'Servidor indisponível — guardado localmente'); }
    SYNC.busy = false; if (SYNC.pending) scheduleSync(800);
  }
  async function deriveSharedKey(accessKey) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(accessKey), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('smartponto-templates-v1'), iterations: 120000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    LS.setItem('sp_device_key', JSON.stringify(await crypto.subtle.exportKey('jwk', key))); Object.keys(templateCache).forEach(k => delete templateCache[k]);
  }
  function showServer() {
    modal(`<h2>Ligação ao servidor</h2><div class="muted small mb">Com a chave de acesso, colaboradores, rostos e marcações ficam guardados em <b>smartponto-two.vercel.app</b> e partilhados por todos os dispositivos. Sem chave, os dados ficam só neste dispositivo.</div>

  }

  function registoBoot() {

  function regGpsCheck() {
    const st = $('#gpsStatus'); if (!navigator.geolocation) { st.textContent = 'Geolocalização indisponível'; return; } st.textContent = 'A verificar…';
    navigator.geolocation.getCurrentPosition(p => { regGps = p; const l = S.locations.find(x => x.id === $('#wLoc').value); const d = l ? SP.haversine(p.coords.latitude, p.coords.longitude, l.lat, l.lng) : null; st.textContent = `GPS verificado · ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} · precisão ±${Math.round(p.coords.accuracy)} m`; setMsg('Localização obtida no dispositivo (não armazenada no cadastro).'); }, e => { regGps = null; st.textContent = 'Localização não autorizada ou indisponível'; setMsg('GPS: ' + e.message, true); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  }
  function registoSave() {
    const code = $('#wCode').value.trim(), name = $('#wName').value.trim(), dept = $('#wDept').value.trim();
    if (!code || !name || !dept) return setMsg('Preencha código, nome e departamento.', true);
    if (S.workers.some(w => w.code === code)) return setMsg('Já existe um colaborador com este código.', true);
    if (!$('#consent').checked) return setMsg('Confirme a informação ao colaborador e a base legal para o tratamento biométrico.', true);
    if (regMethod === 'face' && !pendingFace) return setMsg('Conclua as 2 leituras do rosto antes de guardar.', true);
    const w = { id: SP.uid('w'), code, name, dept, costCenter: $('#wCC').value.trim(), locations: [$('#wLoc').value], shiftId: $('#wShift').value, pin: $('#wPin').value.trim(), active: true, biometrics: { face: { enrolled: false }, finger: { enrolled: false } } };

      st.innerHTML = `Coordenada obtida: <b>${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}</b> · precisão ±${Math.round(p.coords.accuracy)} m · idade ${age} s · origem: navegador${S.policy.trustBrowserGps ? '' : ' <span class="warn">(não aceite como GPS/GNSS)</span>'} · <a href="${mapsUrl(p.coords.latitude, p.coords.longitude)}" target="_blank" rel="noopener">Ver no Google Maps</a>`;
    }, err => { T.gps = { available: false, source: err.code === 1 ? 'denied' : 'none' }; PERM.gps = 'bad'; PERM.gpsText = gpsErrorText(err); if (T.auto) { T.auto = false; setTimeout(() => { if (T.step === 'gps') tSubmit(); }, 600); } st.innerHTML = `<span class="bad">${h(gpsErrorText(err))}</span> Nunca confirmar sem GPS válido na captura (RN04).`; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 8000 });
  }
  async function tSubmit() {
    if (!T.gps) acquireGps(); if (!T.gps) { toast('Aguarde a leitura de posição ou repita'); return; }
    const P = S.policy; const online = isOnline(); const dev = S.devices.find(d => d.id === T.deviceId);
    if (online && T.challenge && Date.now() - T.challenge.issuedAt > P.challengeTtlSec * 1000) { toast('Desafio expirado (' + P.challengeTtlSec + ' s). Recomece a marcação.', 5000); tHome(); return; }
    const att = SP.registerAttempt(S, T.worker.id, SP.nowIso());
    const payload = { event_id: SP.uid('evt'), workerId: T.worker.id, deviceId: T.deviceId, locationId: dev.locationId, action: T.action, method: T.method, capturedAt: T.capturedAt || SP.nowIso(), online, policyVersion: P.version, seq: (S.events.length + queue.length + 1),
      evidence: { identityMatch: T.sim.identity, antispoof: T.sim.antispoof, gps: T.gps, signatureValid: true, clockTrusted: true }, faceDistance: T.sim.distance != null ? +T.sim.distance.toFixed(3) : undefined, capture: T.snapshot || null };
    if (att.exceeded) { payload.evidence.identityMatch = null; payload.evidence.antispoof = 'UNKNOWN'; T.blockedWorkers[T.worker.id] = Date.now(); }
    try { payload.signature = await SP.signEvent(LS, payload); } catch (e) { payload.signature = 'n/a'; }
    let ev;
    if (online) { ev = SP.submitEvent(S, payload).event; if (att.exceeded) { ev.reason = `Limite de tentativas excedido (${P.maxAttempts} em ${P.attemptWindowMin} min): pendência aberta sem falta automática`; ev.state = 'PENDENTE_REVISAO'; } ev.signature = payload.signature; }
    else {
      // RN09: persistir fila cifrada com provas originais ANTES de mostrar o recibo
      const item = Object.assign({}, payload, { snapshot: { state: 'PROVISORIO_OFFLINE' } }); queue.push(item);
      try { await SP.saveQueue(LS, queue); } catch (e) { toast('Falha ao cifrar a fila: ' + e.message); }
      ev = SP.submitEvent(S, Object.assign({}, payload, { online: false })).event; ev.signature = payload.signature; ev.receivedAt = null;
      updQueueBadge();
    }
    dev.lastSeen = SP.nowIso(); save(); T.last = ev; T.step = 'receipt'; tRender();
  }
  async function syncNow() {
    if (!queue.length) return; const items = queue.slice(); const out = SP.syncQueue(S, items);
    queue = []; try { await SP.saveQueue(LS, queue); } catch (e) { } updQueueBadge(); save();
    toast(`Sincronização: ${out.length} evento(s) reconciliado(s) — ${out.map(o => stLabel[o.event.state]).join(', ')}`, 6000); if (T && T.step === 'home') tRender();
  }

  /* ---------- arranque ---------- */
  function init() { load(); openTerminal(); permBoot();
    /* demo: sem ligação a servidor */
     window.addEventListener('online', () => syncNow()); window.addEventListener('online', () => { const e = $('#tOnline'); if (e) { e.checked = true; tOnlineChange(); } }); window.addEventListener('offline', () => { const e = $('#tOnline'); if (e) { e.checked = false; tOnlineChange(); } }); }
  document.addEventListener('DOMContentLoaded', init);

  return { login, logout, go, resetDemo, filt, rfilt, showEvent, review, unblock, decideCorrection, newCorrection, saveCorrection, editWorker, saveWorker, enroll, doEnroll, unenroll, editLocation, saveLocation, editDevice, saveDevice, revoke, editShift, saveShift, addHoliday, delHoliday, savePolicy, exportExcel, exportEvents, runTests, exportTests, closeModal, closeModal2, captureFaceForForm, photoForForm, showServer, saveServer, syncNow: () => syncNow(), camRetry, gpsCheck: () => gpsCheck(false), registoBoot, registoSave, regMethod: regMethodSet, regGps: regGpsCheck,
    showLogin, tConfirmNow, openTerminal, terminalAdminExit, tOnlineChange, tHome, tStep, tAction, tSetAction, tSearch, tSelectWorker, tIdentify, tScanQR, tMethod, tCapture, fpEnroll, acquireGps, tSubmit, syncNow };
})();
