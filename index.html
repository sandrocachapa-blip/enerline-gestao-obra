/* Layout: barra lateral carvão com o logótipo; área de trabalho clara, uma secção de cada vez; no telemóvel a barra passa para o topo. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --brand:#7cc427; --brand-ink:#a2dd58; --on-brand:#10200a; --brand-soft:#2a3a1a;
  --side:#131516; --side-ink:#e8ece4; --side-muted:#8d958f;
  --ok:#8fd694; --ok-bg:#1f3a22; --warn:#f0c064; --warn-bg:#40320f; --bad:#ff9d94; --bad-bg:#4a1f1b; --neu-bg:#33383b;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a1d1f; --surface:#24282b; --ink:#e7eae4; --muted:#9aa39d; --line:#373d41;
  --brand:#7cc427; --brand-ink:#a2dd58; --on-brand:#10200a; --brand-soft:#2a3a1a;
  --side:#131516; --side-ink:#e8ece4; --side-muted:#8d958f;
  --ok:#8fd694; --ok-bg:#1f3a22; --warn:#f0c064; --warn-bg:#40320f; --bad:#ff9d94; --bad-bg:#4a1f1b; --neu-bg:#33383b;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-variant-numeric:tabular-nums}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>iso(new Date());
const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const addDay=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const longDay=s=>{const t=new Date(s+'T12:00').toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});return t[0].toUpperCase()+t.slice(1)};
const nn=x=>{x=String(x??'').trim();return /^\d+$/.test(x)?String(+x):x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- fotografias geradas (SVG leve, sem imagens pesadas) ---------- */
const AVC={};
const avHash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const avUri=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
function avW(w){const key='w'+(w.id||'')+w.nome+(w.funcao||'');if(AVC[key])return AVC[key];
  const h=avHash((w.id||'')+w.nome),pk=(a,o=0)=>a[(h>>>o)%a.length],f=String(w.funcao||'');
  const skin=pk(['#8d5524','#a0673a','#6f4120','#c68642','#5c3a1e','#7b4a2a','#9a6236'],3),sk2=pk(['#7a4a1f','#8f5a30','#5f3719','#b57639','#4d3018','#6b4023','#85542d'],3);
  const fem=/^(Ana|Maria|Isabel|Teresa|Luísa|Luisa|Rosa|Marta|Helena|Joana|Esperança|Carla|Sofia)\b/.test(w.nome||'');
  const helm=/Chefe|Encarregado/.test(f)?'#f4f4f2':/segurança/i.test(f)?'#1e6fc8':/Motorista/.test(f)?'#e8590c':/Operador/.test(f)?'#ff9800':/Topógrafo/.test(f)?'#2e9e57':pk(['#f5c400','#f5c400','#ffb300','#f4f4f2'],7);
  const vest=pk(['#f57c00','#c5e11e','#f57c00'],11),bg=pk(['#dfe8d6','#d9e2ec','#ece6d8','#e3dce8','#d8ebe6'],13);
  const hair=fem?`<ellipse cx="32" cy="31" rx="13.5" ry="15" fill="#1b1b1b"/><circle cx="32" cy="10" r="5" fill="#1b1b1b"/>`:'';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="${bg}"/><path d="M5 64c0-15 12-21 27-21s27 6 27 21z" fill="${vest}"/><path d="M21 47v17M43 47v17" stroke="#fff" stroke-width="3.2"/><path d="M26 43l6 7 6-7" fill="none" stroke="#37474f" stroke-width="2"/><rect x="27" y="36" width="10" height="9" fill="${sk2}"/>${hair}<ellipse cx="32" cy="29" rx="11" ry="13" fill="${skin}"/><path d="M19.5 25c0-10 5-15.5 12.500-15.5S44.500 15 44.500 25z" fill="${helm}"/><rect x="17" y="23.500" width="30" height="3.600" rx="1.800" fill="${helm}"/><path d="M32 9.500v14" stroke="#0002" stroke-width="1.500"/><circle cx="27.500" cy="30" r="1.400" fill="#1c1c1c"/><circle cx="36.500" cy="30" r="1.400" fill="#1c1c1c"/><path d="M28 35q4 3 8 0" fill="none" stroke="#4a2411" stroke-width="1.400" stroke-linecap="round"/></svg>`;
  return AVC[key]=avUri(svg)}
function avV(e){const nm=e.nome||'',key='v'+nm+(e.grupo||'');if(AVC[key])return AVC[key];
  const g=e.grupo||'',col=/serviço/.test(g)?'#f4f4f2':/obra/.test(g)&&/Viatura/.test(g)?'#6aa821':/pesado/.test(g)?'#546e7a':/Elevação/.test(g)?'#f5a300':/Energia/.test(g)?'#c62828':'#f2b705',dk='#263238';
  const wh=(x,y=49,r=7)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#222"/><circle cx="${x}" cy="${y}" r="${r*.42}" fill="#cfd8dc"/>`;
  let b;
  if(/Autocarro/.test(nm))b=`<rect x="6" y="14" width="84" height="34" rx="6" fill="${col}"/>${[12,28,44,60].map(x=>`<rect x="${x}" y="19" width="13" height="11" rx="2" fill="#b3e5fc"/>`).join('')}<rect x="76" y="19" width="10" height="17" rx="2" fill="#b3e5fc"/><rect x="6" y="38" width="84" height="3" fill="#0003"/>${wh(24)}${wh(70)}`;
  else if(/Camião cesto/.test(nm))b=`<path d="M8 24h22l7 12v12H8z" fill="${col}"/><path d="M13 27h14l4 8H13z" fill="#b3e5fc"/><rect x="38" y="32" width="50" height="14" fill="${dk}"/><path d="M54 32l22-22" stroke="#f5a300" stroke-width="5"/><rect x="72" y="4" width="14" height="9" fill="#f5a300"/>${wh(20)}${wh(56)}${wh(76)}`;
  else if(/Camião grua|grua móvel|Grua móvel/i.test(nm))b=`<path d="M8 28h20l6 11v9H8z" fill="${col}"/><path d="M12 31h13l3 6H12z" fill="#b3e5fc"/><rect x="34" y="34" width="54" height="12" fill="${dk}"/><path d="M40 34l42-26" stroke="#f5a300" stroke-width="5"/><path d="M82 8v14" stroke="#555" stroke-width="1.500"/><rect x="79" y="22" width="6" height="5" fill="#555"/>${wh(20)}${wh(52)}${wh(72)}`;
  else if(/basculante/.test(nm))b=`<path d="M8 26h20l6 11v11H8z" fill="${col}"/><path d="M12 29h13l3 6H12z" fill="#b3e5fc"/><path d="M36 22l50-4-4 30H36z" fill="${dk}"/>${wh(20)}${wh(58)}${wh(76)}`;
  else if(/transporte de postes/.test(nm))b=`<path d="M8 26h20l6 11v11H8z" fill="${col}"/><rect x="36" y="38" width="54" height="5" fill="${dk}"/><rect x="38" y="30" width="52" height="5" rx="2.500" fill="#b0a99f"/><rect x="38" y="24" width="52" height="5" rx="2.500" fill="#c9c2b8"/>${wh(20)}${wh(60)}${wh(78)}`;
  else if(/Carrinha de caixa|caixa aberta/.test(nm))b=`<path d="M8 30h18l8-10h10v10h40v16H8z" fill="${col}"/><path d="M26 29l6-8h8v8z" fill="#b3e5fc"/><rect x="44" y="24" width="40" height="6" fill="${dk}"/>${wh(24)}${wh(72)}`;
  else if(/Carrinha|Pick-up|Ligeiro/.test(nm))b=`<path d="M8 32h12l9-13h22l8 13h19v14H8z" fill="${col}" stroke="#90a4ae" stroke-width="1"/><path d="M26 31l6-10h17l5 10z" fill="#b3e5fc"/><path d="M8 40h82" stroke="#6aa821" stroke-width="3"/>${wh(24)}${wh(70)}`;
  else if(/Escavadora|Retroescavadora/.test(nm))b=`<rect x="10" y="46" width="58" height="9" rx="4.500" fill="#333"/><rect x="16" y="30" width="34" height="16" rx="3" fill="${col}"/><rect x="18" y="20" width="16" height="14" rx="2" fill="#b3e5fc" stroke="${col}" stroke-width="2"/><path d="M48 34l22-20 14 16" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round"/><path d="M82 28l10 8-12 3z" fill="${dk}"/>`;
  else if(/Plataforma|Empilhador|Guincho|Freio|Perfuradora/.test(nm))b=`<rect x="14" y="44" width="62" height="8" rx="2" fill="${col}"/>${wh(26,54,5)}${wh(62,54,5)}<path d="M30 44l26-24M56 44L30 20M34 36l16-12" stroke="${dk}" stroke-width="3"/><rect x="24" y="14" width="40" height="7" rx="1" fill="${dk}"/><path d="M26 14v-5h36v5" fill="none" stroke="${dk}" stroke-width="1.800"/>`;
  else if(/Gerador|Compressor|soldar|Betoneira/.test(nm))b=`<rect x="14" y="22" width="68" height="28" rx="3" fill="${col}"/>${[24,34,44,54,64].map(x=>`<rect x="${x}" y="27" width="4" height="14" fill="#0003"/>`).join('')}<rect x="70" y="28" width="9" height="6" fill="#eee"/><rect x="18" y="50" width="8" height="4" fill="${dk}"/><rect x="70" y="50" width="8" height="4" fill="${dk}"/><path d="M82 30l8 8" stroke="${dk}" stroke-width="2.500"/>`;
  else b=`<rect x="8" y="26" width="80" height="20" rx="4" fill="${col}"/>${wh(26)}${wh(70)}`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64"><rect width="96" height="64" fill="#eef1ea"/><rect y="56" width="96" height="8" fill="#cfd6c8"/>${b}</svg>`;
  return AVC[key]=avUri(svg)}

const VIEWS=[['hoje','Hoje','Obra'],['mapa','Localizar obras'],['tarefas','Tarefas diárias'],['plano','Planeamento'],['progresso','Avanço e medições'],
 ['trabalhadores','Trabalhadores','Pessoas'],['ponto','Relógios de ponto'],['biometria','Biometria facial e digital'],['hst','Segurança e HST'],['documentos','Documentos e validades'],['subempreiteiros','Subempreiteiros'],['rh','RH · Primavera'],

 ['utilizadores','Utilizadores e perfis','Sistema']];

const pill=v=>v?`<span class="pill ${tone(v)}">${esc(v)}</span>`:'—';

function persistLocal(){try{localStorage.setItem('enerline_obra',JSON.stringify(data))}catch(e){}}
function fail(e){toast(e&&e.code==='invalid_argument'?'Não tem permissão para alterar os dados desta obra.':e&&e.code==='quota_exceeded'?'O armazenamento está cheio. Apague registos antigos.':'Não foi possível guardar. Tente outra vez.')}
async function save(c,id,obj){data[c][id]=obj;render();
  if(db){try{await db.collection(c).doc(id).set(obj)}catch(e){fail(e)}}else persistLocal()}
async function del(c,id){delete data[c][id];render();
  if(db){try{await db.collection(c).doc(id).delete()}catch(e){fail(e)}}else persistLocal()}
const lost=()=>{$('#sync').textContent='Ligação aos dados perdida. Recarregue a página.'};
const snap=(c,after)=>s=>{const m={};s.docs.forEach(x=>{m[x.id]=JSON.parse(JSON.stringify(x.data()))});data[c]=(typeof demoBusy!=='undefined'&&demoBusy&&demoMap[c])?{...demoMap[c],...m}:m;if(after)after();else render()};
function subObra(){unsubs.forEach(u=>u());unsubs=[];SC.forEach(c=>{data[c]={};if(st.obra)unsubs.push(db.collection(c).where('obra','==',st.obra).limit(1000).onSnapshot(snap(c),lost))})}
function setObra(id){st.obra=id||'';st.res='';st.pw='';try{localStorage.setItem('enerline_obra_sel',st.obra)}catch(e){}if(db)subObra();render()}
async function bulk(jobs,label){let i=0,done=0,err=0;const t=$('#toast');
  const run=async()=>{while(i<jobs.length){const j=jobs[i++];for(let a=0;;a++){try{await j();break}catch(e){if(a<5&&e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await new Promise(r=>setTimeout(r,1200*(a+1)));else{err++;break}}}
    done++;if(done%10===0){clearTimeout(toast.t);t.hidden=false;t.textContent=`${label}: ${done} de ${jobs.length}`}}};
  await Promise.all([1,2,3,4].map(run));toast(err?`${label}: terminou com ${err} falhas.`:`${label}: concluído.`);return err}
let demoBusy=false,demoMap={};
const DAYC=['tarefas','logistica','armazem','ponto','combustivel','transferencias','requisicoes','hst','progresso','compras','rh','documentos'];
async function checkDemo(force){if(!db||demoBusy||!rows('obras').some(o=>o.exemplo))return;const c=data.config.demo,td=today();
  const full=force||!c||c.v<DEMOV;if(!full&&c.day===td)return;
  demoBusy=true;let all=genDemo(td).filter(([k,id])=>!(k==='config'&&id==='demo'));if(!full)all=all.filter(([k])=>DAYC.includes(k));
  const PR=['obras','armazens','fornecedores','rubricas','relogios','subempreiteiros','trabalhadores','equipamentos','ponto','tarefas'];all.sort((x,y)=>(PR.indexOf(x[0])<0?99:PR.indexOf(x[0]))-(PR.indexOf(y[0])<0?99:PR.indexOf(y[0])));
  demoMap={};all.forEach(([k,id,o])=>{(demoMap[k]=demoMap[k]||{})[id]=o;if(data[k])data[k][id]=o});render();
  toast('A atualizar os dados de demonstração…');
  const er=await bulk(all.map(([k,id,o])=>()=>db.collection(k).doc(id).set(o)),'A atualizar demonstração');
  if(!er){try{await db.collection('config').doc('demo').set({v:DEMOV,day:td,exemplo:true})}catch(e){}demoBusy=false;demoMap={}}
  else{toast('Não foi possível gravar toda a demonstração; os dados ficam visíveis só nesta sessão.');demoBusy=true}}
async function loadDemo(){const all=genDemo(today());
  if(!db){all.forEach(([c,id,o])=>{data[c][id]=o});persistLocal();setObra('o1');toast('Dados de demonstração carregados.');return}
  await bulk(all.map(([c,id,o])=>()=>db.collection(c).doc(id).set(o)),'A carregar demonstração')}
async function delObra(id){const jobs=[];
  SC.forEach(c=>rows(c).forEach(r=>jobs.push(()=>{delete data[c][r.id];return db?db.collection(c).doc(r.id).delete():Promise.resolve()})));
  jobs.push(()=>{delete data.obras[id];return db?db.collection('obras').doc(id).delete():Promise.resolve()});
  await bulk(jobs,'A apagar obra');if(!db){persistLocal();const f=rows('obras')[0];if(!f)try{localStorage.setItem('enerline_demo_off','1')}catch(e){}setObra(f?f.id:'')}}
async function boot(){
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))st.view=h;
  try{st.obra=localStorage.getItem('enerline_obra_sel')||''}catch(e){}
  render();
  let d=null;try{if(window.claude&&window.claude.use){d=await window.claude.use('db');dl=await window.claude.use('downloads')}}catch(e){}
  if(d){db=d;mode='db';$('#sync').textContent='Dados partilhados com a equipa';
    db.collection('config').limit(100).onSnapshot(snap('config'),lost);
    db.collection('rubricas').limit(1000).onSnapshot(snap('rubricas'),lost);
    GL.forEach(c=>db.collection(c).limit(1000).onSnapshot(snap(c),lost));
    db.collection('obras').limit(1000).onSnapshot(snap('obras',()=>{const first=!obrasOk;obrasOk=true;
      if(!data.obras[st.obra]){const f=rows('obras')[0];setObra(f?f.id:'')}else{if(first)subObra();render()}setTimeout(checkDemo,1500)}),lost)}
  else{mode='local';obrasOk=true;$('#sync').textContent='Dados guardados só neste browser';
    try{const j=JSON.parse(localStorage.getItem('enerline_obra')||'{}');COLS.forEach(c=>{if(j[c])data[c]=j[c]})}catch(e){}
    try{const dv=+localStorage.getItem('enerline_demov')||0,dd_=localStorage.getItem('enerline_demoday')||'',off=localStorage.getItem('enerline_demo_off'),has=Object.keys(data.obras).length>0;
      if(!off&&(!has||(Object.values(data.obras).some(o=>o.exemplo)&&(dv<DEMOV||dd_!==today())))){
        COLS.forEach(c=>Object.keys(data[c]).forEach(id=>{if(data[c][id]&&data[c][id].exemplo)delete data[c][id]}));
        genDemo(today()).forEach(([c,id,o])=>{data[c][id]=o});if(!data.obras[st.obra])st.obra='o1';
        localStorage.setItem('enerline_demov',String(DEMOV));localStorage.setItem('enerline_demoday',today());persistLocal()}}catch(e){}
    if(!data.obras[st.obra]){const f=rows('obras')[0];st.obra=f?f.id:''}
    render()}
}

/* ---------- formatação ---------- */
const name=(c,id)=>{const o=data[c][id];return o?(o.nome||o.numero||''):''};
const usados=(c,v)=>[].concat(v||[]).filter(i=>data[c][i]);
function plain(f,v){
  if(f.ref){const n=name(f.ref,v);return n||(typeof v==='string'&&/\s/.test(v)?v:'')}
  if(f.refs)return (v||[]).map(i=>name(f.refs,i)).filter(Boolean).join(', ');
  if(f.type==='date')return v?fdate(v):'';
  return v??'';
}
const avImg=(k,r)=>`<img class="av${k==='e'?' v':''}" loading="lazy" alt="" src="${r.foto||(k==='e'?avV(r):avW(r))}">`;
function cell(f,v,row){
  if(f.opts)return pill(v);
  if(f.money)return v?Number(v).toLocaleString('pt-PT')+' Kz':'—';
  const t=plain(f,v);
  return (f.av&&row?avImg(f.av,row):'')+(t===''?'—':esc(t))+(f.req&&row&&row.exemplo?'<span class="ex">exemplo</span>':'');
}

function parsePunches(txt){const out={};let total=0;
  for(const line of txt.split(/\r?\n/)){

    const re=/(?:^|[\s,;"])(\d{1,9})(?=[\s,;"]|$)/;
    const idm=line.slice(0,m.index).match(re)||line.slice(m.index+m[0].length).match(re);
    if(!idm)continue;
    const day=d[0]+'-'+p2(d[1])+'-'+p2(d[2]);

}

function events(){const ev=[];
  rows('tarefas').forEach(t=>{if(t.data)ev.push({day:t.data,hora:t.hora||'',tipo:'Tarefa',titulo:t.titulo,local:t.frente||'',ws:t.responsaveis||[],es:t.equipamentos||[],estado:t.estado||'Pendente',ref:'tarefas:'+t.id})});
  rows('logistica').forEach(l=>{if(l.data)ev.push({day:l.data,hora:'',tipo:'Transporte',titulo:l.descricao,local:[l.origem,l.destino].filter(Boolean).join(' → '),ws:l.motorista?[l.motorista]:[],es:l.viatura?[l.viatura]:[],estado:l.estado||'Planeado',ref:'logistica:'+l.id})});
  rows('armazem').forEach(m=>{if(m.data)ev.push({day:m.data,hora:'',tipo:'Pedido ao armazém',titulo:m.artigo+(m.qtd?' ('+m.qtd+' '+(m.unidade||'')+')':''),local:m.frente||'',ws:m.pedidoPor?[m.pedidoPor]:[],es:[],estado:m.estado||'Pedido',ref:'armazem:'+m.id})});
  return ev.sort((a,b)=>(a.day+a.hora).localeCompare(b.day+b.hora))}
const names=(c,ids)=>ids.map(i=>name(c,i)).filter(Boolean).join(', ');
function punchOf(id,day){const w=data.trabalhadores[id];if(!w)return'';const t=pOf(day)[pkey({...w,id})]||[];
  return !t.length?'':t.length>1?t[0]+' – '+t[t.length-1]:t[0]+' (sem saída)'}

async function buildXlsx(lines){const zip=await window.JSZip.loadAsync(await getTpl());
